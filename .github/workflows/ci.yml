# Lint, typecheck, test and build on every push and pull request; then run the
# browser-mode tests and the 50K x 200 bench in Chromium and Firefox
# (docs/adr/0011).
# On pushes to main, additionally publish dist/ to GitHub Pages (docs/adr/0003).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Install bgzip (htslib, via tabix)
        run: sudo apt-get update && sudo apt-get install -y tabix
      - run: npm test
        env:
          BGZIP_BIN: bgzip
      - run: npm run build
      - run: npm run build:cli
      - name: Fixture and contract cases are reproducible
        run: |
          npm run fixture
          npm run contract
          git diff --exit-code -- tests/fixtures contract
      - uses: actions/upload-pages-artifact@v5
        if: vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist

  # Browser-mode tests and the bench. Interim CI budget of 60 s (about ten
  # times the M4 laptop Firefox first draw of 6.2 s, half the former 120 s hang
  # guard; docs/m5-phases.md 15.1). Once one green run has printed its figures,
  # set this to four times the slower browser's first-draw figure, rounded up
  # to the next 5 s, and record both in PLAN.md's M5 block. Then Lighthouse's
  # accessibility category on the built landing page
  # (scripts/lighthouse-a11y.mjs, PLAN.md M3).
  browser:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: npm run test:bench
        env:
          VITE_BENCH_BUDGET_MS: '60000'
      - run: npm run a11y:lighthouse

  # Byte-compares contract/ with progeny-selector's mirror (docs/adr/0013).
  # Red between a contract bump here and the sibling's mirror commit is
  # expected and is the signal; deploy does not wait for this job.
  contract-mirror:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: piercetaylor/progeny-selector
          path: progeny-selector
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/check-contract-mirror.mjs progeny-selector

  # Generates the six CLI CSV tables from the synthetic fixture and reads
  # them back with readr under explicit column types (scripts/read_exports.R),
  # modelled on progeny-selector's r-reader job (r-lib/actions/setup-r@v2).
  # Not a per-commit gate; run in CI only.
  r-reader:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - id: r-deps
        uses: r-lib/actions/setup-r-dependencies@v2
        continue-on-error: true
        with:
          packages: any::readr
      - name: readr fallback install
        if: steps.r-deps.outcome == 'failure'
        run: Rscript -e 'install.packages("readr", repos = "https://cloud.r-project.org")'
      - name: generate the CSV exports from the fixture
        run: |
          node src/cli.ts summarize --genotypes tests/fixtures/synthetic/genotypes.vcf --samples tests/fixtures/synthetic/samples.csv --markers tests/fixtures/synthetic/markers.csv --out summary.csv
          node src/cli.ts segments --genotypes tests/fixtures/synthetic/genotypes.vcf --samples tests/fixtures/synthetic/samples.csv --markers tests/fixtures/synthetic/markers.csv --out segments.csv
          node src/cli.ts targets --genotypes tests/fixtures/synthetic/genotypes.vcf --samples tests/fixtures/synthetic/samples.csv --markers tests/fixtures/synthetic/markers.csv --target name=Gm13:28,500,000-29,100,000 --out targets.csv
          node src/cli.ts compare --genotypes tests/fixtures/synthetic/genotypes.vcf --samples tests/fixtures/synthetic/samples.csv --a NIL_03 --b RP_Williams --out pairwise.csv
          node src/cli.ts discordant --genotypes tests/fixtures/synthetic/genotypes.vcf --samples tests/fixtures/synthetic/samples.csv --a NIL_03 --b RP_Williams --mode all --out discordant.csv
          node src/cli.ts qc --genotypes tests/fixtures/synthetic/genotypes.vcf --samples tests/fixtures/synthetic/samples.csv --markers tests/fixtures/synthetic/markers.csv --out qc.csv
      - run: Rscript scripts/read_exports.R summary.csv segments.csv targets.csv pairwise.csv discordant.csv qc.csv

  # Deploying needs Pages turned on for the repository first (docs/adr/0003).
  # Until then this job is skipped rather than failing every push to main: set
  # the repository variable ENABLE_PAGES to "true" once Pages is enabled with
  # the GitHub Actions source.
  deploy:
    needs: check
    if: vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
