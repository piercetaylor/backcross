version: 2
updates:
  # Exact pins (vitest, @vitest/browser-playwright, react-aria-components,
  # axe-core, lighthouse, chrome-launcher, esbuild) are deliberate; a major
  # bump is reviewed against the gates, never merged unread.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x does not accept TypeScript 7 as a peer (npm ci
      # fails with ERESOLVE; PR #4, 2026-09-30). Remove once it does.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
